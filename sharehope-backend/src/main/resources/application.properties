spring.application.name=sharehope-backend

# Database (PostgreSQL)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sharehope}
spring.datasource.username=${DB_USERNAME:sharehope}
spring.datasource.password=${DB_PASSWORD:sharehope}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}

# CORS (comma-separated list of allowed frontend origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Automatic English-to-French CMS translation (DeepL API)
app.translation.deepl-auth-key=${DEEPL_AUTH_KEY:}
app.translation.deepl-api-url=${DEEPL_API_URL:https://api-free.deepl.com/v2/translate}
app.payment.internal-secret=${PAYMENT_INTERNAL_SECRET:}
app.brevo.api-key=${BREVO_API_KEY:}
app.brevo.list-id=${BREVO_LIST_ID:}
app.newsletter.unsubscribe-secret=${NEWSLETTER_UNSUBSCRIBE_SECRET:}
app.public-url=${PUBLIC_SITE_URL:https://www.sharehopeforall.org}
