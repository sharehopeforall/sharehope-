name: Verify
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: sharehope_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MIGRATION_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/sharehope_migration_test
      MIGRATION_TEST_DATABASE_USER: postgres
      MIGRATION_TEST_DATABASE_PASSWORD: postgres
    defaults:
      run:
        working-directory: sharehope-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sharehope-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sharehope-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build -- --webpack
      - run: npm audit --omit=dev
